[package]
name = "redstring"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.34.3"
egui = "0.34.3"
egui-phosphor = "0.12"
egui_graphs = "0.30.0"
# decode entity images (mugshots/logos) → egui textures; formats match the picker filter
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
petgraph = { version = "0.8.3", features = ["serde-1"] }
rfd = "0.17.2"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# light install profile — inherits release (LLVM backend, no cranelift SIMD panic)
# but opt-level 1 + fat codegen-units + no LTO = far faster to build than full release.
# install with: cargo install --path . --profile fast --force
[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
incremental = true

# redstring drags in the wgpu/egui stack, which uses SIMD intrinsics cranelift
# can't codegen yet (panics at runtime: `llvm.x86.sse2.psrl.w is not yet
# supported`). The global ~/.cargo/config.toml defaults profile.dev to cranelift
# for fast iteration; this closer config wins on cargo's hierarchical merge and
# forces LLVM for this crate's builds only. Everything else is inherited.
[unstable]
codegen-backend = true

[profile.dev]
codegen-backend = "llvm"
